apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-support-chatbot
  labels:
    app: customer-support-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-support-chatbot
  template:
    metadata:
      labels:
        app: customer-support-chatbot
    spec:
      containers:
      - name: customer-support-chatbot-container
        image: customer-support-chatbot:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8501
        envFrom:
          - secretRef:
              name: llmops-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: customer-support-chatbot-service
spec:
  type: LoadBalancer
  selector:
    app: customer-support-chatbot
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501